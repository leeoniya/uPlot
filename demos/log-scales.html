<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Log Scales</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
	</head>
	<body>
		<script src="../dist/uPlot.iife.js"></script>
		<script type="module">
			import msg from "./data/log-scales.js";

			// log scales cannot contain 0, so turn any 0s into 1s
			msg.graphData.forEach(counts => {
				counts.forEach((v, i) => {
					if (v == 0)
						counts[i] = 1;
				});
			});

			let data = [
				msg.timestamps,
				...msg.graphData,
			];

			const optsLog = {
				width: 1600,
				height: 600,
				title: "Log Y Scale",
				scales: {
					y: {
						distr: 3,
					},
				},
				axes: [
					{},
					{
						size: 60,
						space: 15,
					}
				],
				series: [
					{},
					...msg.servers.map(s => ({
						label: s.name,
						stroke: s.color,
						spanGaps: true,
					}))
				],
			};

			let uLog = new uPlot(optsLog, data, document.body);

			const optsLinear = {
				width: 1600,
				height: 600,
				title: "Linear Y Scale",
				axes: [
					{},
					{
						size: 60,
						space: 15,
					}
				],
				series: [
					{},
					...msg.servers.map(s => ({
						label: s.name,
						stroke: s.color,
						spanGaps: true,
					}))
				],
			};

			let uLinear = new uPlot(optsLinear, data, document.body);
		</script>
	</body>
</html>
