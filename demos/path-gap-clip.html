<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Path &amp; Gap Clipping</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../dist/uPlot.min.css">

</head>

<body>
  <script type="module">
    import { renderDemo } from './renderDemo.js';

    await import("../dist/uPlot.esm.js").then(m => { window.uPlot = m.default; });
    await import('./path-gap-clip.js').then(async ({ default: groups }) => {
      const plots = await renderDemo(groups);

      setInterval(() => {
        [plots[0][0], plots[1][0], plots[2][0], plots[3][0]].forEach(u => {
          u.series.forEach(s => {
            s.spanGaps = !s.spanGaps;
          });
          u.redraw();
        })
      }, 1000);
    });
  </script>
</body>

</html>
