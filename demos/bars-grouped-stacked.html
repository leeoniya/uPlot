<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Bars (Grouped or Stacked)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				display: inline-block;
				vertical-align: top;
			}

			.uplot .legend .series:first-child,
			.uplot .legend .series th::after,
			.uplot .legend .series td {
				display: none;
			}

			.hidden {
				color: silver;
			}

			.bar-mark {
				position: absolute;
				background: rgba(255,255,255, 0.3);
			}
		</style>
	</head>
	<body>
		<script type="module">
			import { renderDemo } from './renderDemo.js';

			await import('../dist/uPlot.esm.js').then(m => { window.uPlot = m.default; });
			await import('./bars-grouped-stacked.js').then(({ default: groups }) => renderDemo(groups));
		</script>
	</body>
</html>
