<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Sparse Heatmap</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="../src/uPlot.css">
		<style>
			body { margin: 24px; color: #b7bdc5; background: #181b1f; font: 14px system-ui, sans-serif; }
			h1 { font-size: 20px; }
			.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0; }
			#height { width: min(400px, 50vw); }
			#height-value { min-width: 6ch; }
			#plot { width: 100%; }
			.u-cursor-pt { border-radius: 0; }
			#legend { width: 260px; margin: 12px 0 12px 85px; }
			#color-ramp { height: 10px; }
			#color-labels { display: flex; justify-content: space-between; margin-top: 4px; }
			#hover { display: block; min-height: 2em; font: 13px monospace; }
		</style>
	</head>
	<body>
		<main id="demo">
			<h1>Sparse heatmap · mode: 2</h1>
			<p>The default dataset has ~250k synthetic cells. About 2% of its time columns are missing. Zoom to inspect the gaps.</p>
			<div class="controls">
				<label for="dataset">Dataset</label>
				<select id="dataset" disabled>
					<option value="synthetic" selected>Synthetic</option>
					<option value="snapshot1">Snapshot 1 · zero and positive buckets</option>
					<option value="snapshot2">Snapshot 2 · negative, zero and positive buckets</option>
					<option value="classic">Prometheus classic · le buckets</option>
					<option value="categorical">Categorical · method × status</option>
				</select>
				<button id="set-data" type="button" disabled>setData() — same data</button>
			</div>

			<p id="status">Generating ~250k synthetic heatmap cells…</p>
			<div class="controls">
				<label for="y-scale">Y display scale</label>
				<select id="y-scale" disabled>
					<option value="log" selected>Log₂</option>
											<option value="log10">Log₁₀</option>
					<option value="linear">Linear</option>
					<option value="asinh">Asinh</option>
				</select>
				<label><input id="signed-data" type="checkbox" disabled> Mirror negative buckets</label>
				<label for="color-scale">Color scale</label>
				<select id="color-scale" disabled>
					<option value="linear" selected>Linear</option>
					<option value="sqrt">Square root</option>
					<option value="cbrt">Cube root</option>
					<option value="log">Log</option>

				</select>
				<label for="color-count">Palette colors</label>
				<input id="color-count" type="range" min="11" max="32" step="1" value="24" disabled>
				<output id="color-count-value" for="color-count">24</output>
				<label for="cell-gap">Cell gap</label>
				<input id="cell-gap" type="range" min="0" max="1" step="0.25" value="0" disabled>
				<output id="cell-gap-value" for="cell-gap">0px</output>

				<label for="height">Chart height</label>
				<input id="height" type="range" min="200" max="1200" step="10" value="560" disabled>
				<output id="height-value" for="height">560px</output>
			</div>
			<div id="plot"></div>
			<div id="legend">
				<div id="color-ramp"></div>
				<div id="color-labels"><span id="color-min"></span><span id="color-scale-label">Count · linear scale</span><span id="color-max"></span></div>
			</div>
			<output id="hover"></output>
		</main>
		<script type="module">
			import { createDemo } from './heatmap-cells.js';
			import { generateHeatmapCells } from './lib/heatmapCellsData.js';

			try {
				const response = await fetch('./data/heatmap-classic.json');
				if (!response.ok) throw new Error(`Classic frame: HTTP ${response.status}`);
				const frames = generateHeatmapCells({ xGapProbability: 0.02 });
				createDemo(document.querySelector('#demo'), frames.concat(await response.json()));
			}
			catch (error) {
				document.querySelector('#status').textContent = `Cannot load heatmap: ${error.message}. Serve the repository root over HTTP.`;
				console.error(error);
			}
		</script>
	</body>
</html>
