<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Axis Autosize</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				background: #eee;
			}

			.u-under {
				background: rgba(0,0,0,0.1);
			}
		</style>
	</head>
	<body>
		<script src="../dist/uPlot.iife.js"></script>
		<script>
			function f(x) {
				return Math.random() - 0.5 + Math.sin(x * 0.00002) * 40 + Math.sin(x * 0.001) * 5 + Math.sin(x * 0.1) * 2;
			}

			const points = 501;

			function getData(max, mult) {
				mult = mult || 1;

				const data = [
					Array(points),
					Array(points)
				];

				for (let x = 0; x < max; x++) {
					data[0][x] = x;
					data[1][x] = f(x) * mult;
				}

				return data;
			}

			function maxLabelWidth(self, axis, values) {
				let ctx = self.ctx;
				let width = 0;

				// Preserve the canvas state so the font cache stays valid.
				ctx.save();
				ctx.font = axis.font[0];

				for (let value of values ?? []) {
					if (value != null)
						width = Math.max(width, ctx.measureText(String(value)).width);
				}

				ctx.restore();

				return width / self.pxRatio;
			}

			function autoPadRight(self, side, sidesWithAxes, phase) {
				const baseline = 8;

				if (phase == 'layout')
					return baseline;

				let xAxis = self.axes[0];
				const inset = 4;

				// Return total padding without feedback from tick positions.
				return Math.max(baseline, Math.ceil(maxLabelWidth(self, xAxis, xAxis._values) / 2 + inset));
			}

			const opts = {
				title: "Axis AutoSize",
				width: 1048,
				height: 600,
				padding: [null, autoPadRight, null, null],
				scales: {
					x: {
						time: false,
					//	auto: false,
					//	range: [0, 6],
					},
				},
				series: [
					{
						label: "x",
					},
					{
						label: "sin(x)",
						stroke: "red",
					}
				],
				axes: [
					{
						label: "X Axis Label",
						labelSize: 20,
						values(self, splits) {
							return splits.map(s => s * mult);
						}
					},
					{
						label: "Y Axis Label",
						labelGap: 8,
						labelSize: 8 + 12 + 8,
						stroke: "red",
						size(self, values, axisIdx) {
							let axis = self.axes[axisIdx];
							let axisSize = axis.ticks.size + axis.gap;

							axisSize += maxLabelWidth(self, axis, values);

							return Math.ceil(axisSize);
						},
					}
				],
			};

			let mult = 1;

			let u = new uPlot(opts, getData(points, mult), document.body);

			let it = setInterval(() => {
				u.setData(getData(points, mult *= 10));

				if (mult == 1e9)
					clearInterval(it);
			}, 500);
		</script>
	</body>
</html>
