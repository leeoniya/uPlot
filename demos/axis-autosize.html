<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Axis Autosize</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../src/uPlot.css">
		<style>
			.uplot {
				background: #eee;
			}

			.uplot + .uplot {
				margin-top: 32px;
			}

			.u-under {
				background: rgba(0,0,0,0.1);
			}
		</style>
	</head>
	<body>
		<script type="module">
			import uPlot from '../src/uPlot.js';
			function f(x) {
				return Math.random() - 0.5 + Math.sin(x * 0.00002) * 40 + Math.sin(x * 0.001) * 5 + Math.sin(x * 0.1) * 2;
			}

			const points = 501;

			function getData(max, mult) {
				mult = mult || 1;

				const data = [
					Array(points),
					Array(points)
				];

				for (let x = 0; x < max; x++) {
					data[0][x] = x;
					data[1][x] = f(x) * mult;
				}

				return data;
			}

			const opts = {
				title: "Axis AutoSize — ordinary ranging",
				width: 1048,
				height: 600,
				padding: [null, [8, Infinity], null, null],
				scales: {
					x: {
						time: false,
					//	auto: false,
					//	range: [0, 6],
					},
				},
				series: [
					{
						label: "x",
					},
					{
						label: "sin(x)",
						stroke: "red",
					}
				],
				axes: [
					{
						size: 'auto',
						label: "X Axis Label",
						labelSize: 20,
						values(self, splits) {
							return splits.map(s => s * mult);
						}
					},
					{
						label: "Y Axis Label",
						labelGap: 8,
						labelSize: 8 + 12 + 8,
						stroke: "red",
						size: 'auto',
					}
				],
			};

			let mult = 1;

			let data = getData(points, mult);
			let u = new uPlot(opts, data, document.body);
			let uRanged = new uPlot({
				...opts,
				title: "Axis AutoSize — tick-aware ranging",
				scales: {
					...opts.scales,
					y: { axis: 1 },
				},
			}, data, document.body);

			let it = setInterval(() => {
				let data = getData(points, mult *= 10);
				u.setData(data);
				uRanged.setData(data);

				if (mult == 1e9)
					clearInterval(it);
			}, 500);
		</script>
	</body>
</html>
