<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Data Smoothing and Outliers</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				margin-bottom: 50px;
			}

			form label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				margin: 0 16px 12px 0;
			}

			form input[type="range"] {
				width: 180px;
			}

			.slider-value {
				min-width: 4ch;
				font-variant-numeric: tabular-nums;
			}
		</style>
	</head>
	<body>
		<script src="./lib/ASAP-optimized.js"></script>
		<script src="./lib/sgg.js"></script>
		<script src="./lib/dbscan1d.js"></script>
		<script src="./lib/double-mad.js"></script>
		<script src="./lib/loess.js"></script>
		<script src="./lib/mean-gam.js"></script>
		<script src="./lib/quantile-gam.js"></script>
		<script src="../dist/uPlot.iife.js"></script>

		<script>
			// http://futuredata.stanford.edu/asap/
			// https://github.com/stanford-futuredata/ASAP

			function makeChart(title, range, data, extraSeries = []) {
				const opts = {
					title,
					width: 1920,
					height: 300,
					scales: {
						x: {
							time: false,
						},
						y: {
							auto: false,
							range,
						}
					},
					axes: [
						{},
						{
							size: 60,
						},
					],
					series: [
						{},
						{
							label: "Trips",
							stroke: "red",
							width: 1 / devicePixelRatio,
						},
						...extraSeries,
					],
				};

				return new uPlot(opts, data, document.body);
			}

			fetch("./data/taxi-trips.json").then(r => r.json()).then(data => {
				makeChart("Taxi Trips (raw)", [0, 4e4], [
					data.map((v, i) => i),
					data,
				]);

				const controls = document.createElement("form");
				controls.innerHTML = `
					<p>Global mode compares values across the full series. Local mode also limits neighbors to a centered sample window.
					Blue points are outliers. Core points and their border points are inliers. The original data stays unchanged.</p>
					<p>The radius counts sample positions, not elapsed time. Missing samples retain their positions.
					Windows at the series edges contain fewer samples, but the minimum count stays fixed.</p>

					<label>Mode: <select name="mode"><option value="global">Global</option><option value="local">Local</option></select></label>
					<label>Window radius (samples on each side): <input name="windowRadius" type="range" min="0" max="300" step="1" value="50" disabled><span class="slider-value"></span></label>
					<label>Value threshold (epsilon): <input name="epsilon" type="range" min="0" max="5000" step="10" value="100"><span class="slider-value"></span></label>
					<label>Minimum points (including self): <input name="minPoints" type="range" min="1" max="100" step="1" value="20"><span class="slider-value"></span></label>
					<button type="button" data-preset="global">Global outlier preset</button>
					<button type="button" data-preset="local">Local outlier preset</button>
					<output aria-live="polite"></output>
				`;
				document.body.appendChild(controls);

				const detector = prepareDbscan1d(data);
				const detectionOptions = {epsilon: 100, minPoints: 20, windowRadius: Infinity};
				const outliers = Array(data.length).fill(null);
				const outlierData = [data.map((v, i) => i), data, outliers];
				const output = controls.querySelector("output");
				const sliders = controls.querySelectorAll('input[type="range"]');
				const outlierChart = makeChart("Taxi Trips (DBSCAN outliers)", [0, 4e4], outlierData, [{
					label: "Outliers",
					stroke: "blue",
					paths: () => null,
					points: {show: true, size: 7, fill: "blue"},
				}]);

				function findOutliers() {
					controls.elements.windowRadius.disabled = controls.elements.mode.value !== "local";
					for (const slider of sliders)
						slider.nextElementSibling.textContent = slider.value;
					detectionOptions.epsilon = controls.elements.epsilon.valueAsNumber;
					detectionOptions.minPoints = controls.elements.minPoints.valueAsNumber;
					detectionOptions.windowRadius = controls.elements.mode.value === "local" ? controls.elements.windowRadius.valueAsNumber : Infinity;
					console.time("dbscan1d");
					const labels = detector.detect(detectionOptions);
					console.timeEnd("dbscan1d");

					let count = 0;
					for (let i = 0; i < data.length; i++) {
						outliers[i] = labels[i] === -1 ? data[i] : null;
						if (labels[i] === -1)
							count++;
					}
					outlierChart.setData(outlierData);
					output.textContent = ` ${count} outliers`;
				}

				controls.elements.mode.addEventListener("change", findOutliers);
				for (const slider of sliders)
					slider.addEventListener("input", findOutliers);

				for (const button of controls.querySelectorAll("[data-preset]")) {
					button.addEventListener("click", () => {
						const local = button.dataset.preset === "local";
						controls.elements.mode.value = button.dataset.preset;
						controls.elements.epsilon.value = local ? 1000 : 100;
						controls.elements.minPoints.value = local ? 5 : 20;
						controls.elements.windowRadius.value = 50;
						findOutliers();
					});
				}

				controls.addEventListener("submit", event => {
					event.preventDefault();
					findOutliers();
				});
				findOutliers();

				const madControls = document.createElement("form");
				madControls.id = "double-mad-controls";
				madControls.innerHTML = `
					<p>Double MAD uses a Harrell–Davis median and separate left and right MADs across the full series.
					Each MAD is the Harrell–Davis median of the absolute deviations on that side.</p>
					<p>Score = 0.67449 × absolute deviation / side MAD. Scores above the threshold are outliers.
					With zero side MAD, values unequal to the center are outliers. The original data stays unchanged.</p>
					<label>Score threshold: <input name="threshold" type="range" min="0" max="6" step="0.05" value="3.5"><span class="slider-value"></span></label>
					<output aria-live="polite"></output>
					<p class="mad-stats"></p>
				`;
				document.body.appendChild(madControls);

				console.time("double-mad prepare");
				const madDetector = prepareDoubleMad(data);
				console.timeEnd("double-mad prepare");
				const madOutliers = Array(data.length).fill(null);
				const madData = [outlierData[0], data, madOutliers];
				const madOutput = madControls.querySelector("output");
				madControls.querySelector(".mad-stats").textContent =
					`Median: ${madDetector.median?.toFixed(2) ?? "n/a"}; left MAD: ${madDetector.leftMad?.toFixed(2) ?? "n/a"}; right MAD: ${madDetector.rightMad?.toFixed(2) ?? "n/a"}`;
				const madChart = makeChart("Taxi Trips (Double MAD, Harrell–Davis)", [0, 4e4], madData, [{
					label: "Outliers",
					stroke: "blue",
					paths: () => null,
					points: {show: true, size: 7, fill: "blue"},
				}]);

				function findMadOutliers() {
					madControls.elements.threshold.nextElementSibling.textContent = madControls.elements.threshold.value;
					console.time("double-mad detect");
					const labels = madDetector.detect(madControls.elements.threshold.valueAsNumber);
					console.timeEnd("double-mad detect");

					let count = 0;
					for (let i = 0; i < data.length; i++) {
						madOutliers[i] = labels[i] === -1 ? data[i] : null;
						if (labels[i] === -1)
							count++;
					}
					madChart.setData(madData);
					madOutput.textContent = ` ${count} outliers`;
				}

				madControls.elements.threshold.addEventListener("input", findMadOutliers);
				madControls.addEventListener("submit", event => {
					event.preventDefault();
					findMadOutliers();
				});
				findMadOutliers();

				console.time("sgg");
				let data3 = sgg(data, 1, {
					windowSize: 101,
				//	derivative: 1,
				});
				console.timeEnd("sgg");
			//	console.log(data3);

				makeChart("Savitzky-Golay", [0, 3e4], [
					data3.map((v, i) => i),
					data3,
				]);

				console.time("smooth");
				let data2 = smooth(data, 150);
				console.timeEnd("smooth");

				makeChart("Taxi Trips (ASAP FFT)", [12e3, 20e3], [
					data2.map((v, i) => i),
					data2,
				]);

				function movingAvg(data, wind) {
					let rolled = Array(data.length).fill(null);

					let sum = 0;
					let count = 0;

					for (let i = 0; i < data.length; i++) {
						let y = data[i];

						if (y == null)
							continue;

						sum += y;
						count++;

						if (i > wind - 1) {
							sum -= data[i - wind];
							count--;
						}

						rolled[i] = sum / count;
					}

					return rolled;
				}

				console.time("roll");
				let rolled = movingAvg(data, 300);
				console.timeEnd("roll");

				makeChart("Taxi Trips (Moving Avg 300)", [10e3, 20e3], [
					rolled.map((v, i) => i),
					rolled,
				]);

				const loessControls = document.createElement("form");
				loessControls.id = "loess-controls";
				loessControls.innerHTML = `
					<p>LOESS fits a local line with tricube weights. The span sets the fraction of samples in each neighborhood.
					Larger spans give smoother curves. Robustness iterations reduce the influence of samples with large residuals.</p>
					<p>The fit budget limits local regressions on large series. Other samples use linear interpolation in x.
					Neighborhoods of 16 samples or fewer use exact fits. LOESS and both GAM modes accept ordered, nonuniform x coordinates.</p>
					<label>Span (logarithmic): <input name="logSpan" type="range" min="-5" max="3" step="0.01" value="0"><span class="slider-value"></span></label>
					<label>Robustness iterations: <input name="robustnessIters" type="range" min="0" max="5" step="1" value="2"><span class="slider-value"></span></label>
					<label>Local fit budget: <input name="maxFits" type="range" min="128" max="2048" step="128" value="512"><span class="slider-value"></span></label>
				`;
				document.body.appendChild(loessControls);
				const loessData = [outlierData[0], data];
				const loessFitter = createLoess();
				const loessOptions = {x: loessData[0], span: 0.05, robustnessIters: 2, maxFits: 512};
				const loessSliders = loessControls.querySelectorAll('input[type="range"]');
				let loessChart;

				function fitLoess() {
					for (const slider of loessSliders)
						slider.nextElementSibling.textContent = slider.value;
					const spanSlider = loessControls.elements.logSpan;
					loessOptions.span = 0.05 * 2 ** spanSlider.valueAsNumber;
					const spanText = String(Number(loessOptions.span.toPrecision(4)));
					spanSlider.nextElementSibling.textContent = spanText;
					spanSlider.setAttribute("aria-valuetext", spanText);
					loessOptions.robustnessIters = loessControls.elements.robustnessIters.valueAsNumber;
					loessOptions.maxFits = loessControls.elements.maxFits.valueAsNumber;
					console.time("loess");
					loessData[2] = loessFitter(data, loessOptions);
					console.timeEnd("loess");
					loessChart?.setData(loessData);
				}

				loessControls.addEventListener("input", fitLoess);
				loessControls.addEventListener("submit", event => {
					event.preventDefault();
					fitLoess();
				});
				fitLoess();
				loessChart = makeChart("Taxi Trips (LOESS)", [0, 4e4], loessData, [{
					label: "LOESS",
					stroke: "blue",
					width: 2,
					points: {show: false},
				}]);

				const gamControls = document.createElement("form");
				gamControls.id = "gam-controls";
				gamControls.innerHTML = `
					<p>The default generalized additive model (GAM) fits the conditional mean by penalized least squares.
					It uses cubic B-splines and one banded solve, with linear work in the sample count and basis size.</p>
					<p>The checkbox replaces the mean with quantile fits using the same basis and second-difference penalty.
					Higher λ gives smoother curves. λ is manual, not automatically selected, and its effect differs between the two losses.</p>
					<p data-quantile-details hidden>Quantile fits use iterative optimization, with a limit of 10,000 iterations per quantile.
					The curves fit independently and can cross. They describe conditional quantiles, not a confidence interval.</p>
					<label><input name="quantile" type="checkbox">Quantile fits (slower)</label>
					<label>Spline basis size: <input name="knots" type="range" min="8" max="60" step="1" value="30"><span class="slider-value"></span></label>
					<label>Smoothness (λ, logarithmic): <input name="logLambda" type="range" min="-2" max="4" step="0.25" value="1"><span class="slider-value"></span></label>
					<label>Lower-tail probability: <input name="tail" type="range" min="0.05" max="0.45" step="0.05" value="0.1" disabled><span class="slider-value"></span></label>
					<button type="submit">Fit GAM</button>
					<output aria-live="polite"></output>
				`;
				document.body.appendChild(gamControls);
				const gamData = [outlierData[0], data];
				const gamFitter = createMeanGAM();
				const gamOptions = {x: gamData[0], quantiles: [0.1, 0.5, 0.9], knots: 30, lambda: 10};
				const meanSeries = [{label: "Mean", stroke: "blue", width: 2, points: {show: false}}];
				const quantileSeries = [
					{label: "Lower quantile", stroke: "green", width: 2, points: {show: false}},
					{label: "Median", stroke: "blue", width: 2, points: {show: false}},
					{label: "Upper quantile", stroke: "purple", width: 2, points: {show: false}},
				];
				const gamOutput = gamControls.querySelector("output");
				const quantileDetails = gamControls.querySelector("[data-quantile-details]");
				let quantileFitter;
				let quantileMode = false;
				let gamChart;
				let gamTimer = null;

				function gamReadouts() {
					const quantile = gamControls.elements.quantile.checked;
					gamControls.elements.tail.disabled = !quantile;
					quantileDetails.hidden = !quantile;
					gamControls.elements.knots.nextElementSibling.textContent = gamControls.elements.knots.value;
					gamControls.elements.logLambda.nextElementSibling.textContent = Number((10 ** gamControls.elements.logLambda.valueAsNumber).toPrecision(3));
					gamControls.elements.tail.nextElementSibling.textContent = gamControls.elements.tail.value;
				}

				function fitGam() {
					if (gamTimer !== null) clearTimeout(gamTimer);
					gamTimer = null;
					gamReadouts();
					const tail = gamControls.elements.tail.valueAsNumber;
					gamOptions.quantiles[0] = tail;
					gamOptions.quantiles[2] = 1 - tail;
					gamOptions.knots = gamControls.elements.knots.valueAsNumber;
					gamOptions.lambda = 10 ** gamControls.elements.logLambda.valueAsNumber;
					const quantile = gamControls.elements.quantile.checked;
					if (quantile) {
						quantileFitter ??= createQuantileGAM();
						console.time("quantile GAM");
						const fit = quantileFitter(data, gamOptions);
						console.timeEnd("quantile GAM");
						let labels = "";
						let unfinished = "";
						let iterations = 0;
						for (let q = 0; q < fit.curves.length; q++) {
							gamData[q + 2] = fit.curves[q];
							const label = `p${Math.round(gamOptions.quantiles[q] * 100)}`;
							labels += (q ? " / " : "") + label;
							if (!fit.converged[q]) unfinished += (unfinished ? ", " : "") + label;
							iterations = Math.max(iterations, fit.iterations[q]);
						}
						gamOutput.textContent = ` ${labels} · ` +
							(unfinished ? `Iteration limit reached for ${unfinished}. These fits are approximate.` :
								`Converged in up to ${iterations} iterations.`);
					}
					else {
						console.time("mean GAM");
						gamData[2] = gamFitter(data, gamOptions);
						console.timeEnd("mean GAM");
						gamData.length = 3;
						gamOutput.textContent = " Mean · Penalized least squares.";
					}
					if (gamChart && quantile !== quantileMode) {
						for (let i = quantileMode ? 3 : 1; i > 0; i--) gamChart.delSeries(2);
						const series = quantile ? quantileSeries : meanSeries;
						for (let i = 0; i < series.length; i++) gamChart.addSeries(series[i], i + 2);
					}
					quantileMode = quantile;
					gamChart?.setData(gamData);
				}

				gamControls.elements.quantile.addEventListener("change", fitGam);
				gamControls.addEventListener("input", event => {
					if (event.target === gamControls.elements.quantile) return;
					gamReadouts();
					gamOutput.textContent = " Waiting to refit…";
					if (gamTimer !== null) clearTimeout(gamTimer);
					gamTimer = setTimeout(fitGam, 200);
				});
				gamControls.addEventListener("submit", event => {
					event.preventDefault();
					fitGam();
				});
				fitGam();
				gamChart = makeChart("Taxi Trips (GAM)", [0, 4e4], gamData, meanSeries);
			});
		</script>
	</body>
</html>
