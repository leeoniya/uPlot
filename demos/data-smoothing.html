<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>ASAP Smoothing</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				margin-bottom: 50px;
			}
		</style>
	</head>
	<body>
		<script src="./lib/ASAP-optimized.js"></script>
		<script src="./lib/sgg.js"></script>
		<script src="./lib/dbscan1d.js"></script>
		<script src="./lib/double-mad.js"></script>
		<script src="../dist/uPlot.iife.js"></script>

		<script>
			// http://futuredata.stanford.edu/asap/
			// https://github.com/stanford-futuredata/ASAP

			function makeChart(title, range, data, extraSeries = []) {
				const opts = {
					title,
					width: 1920,
					height: 300,
					scales: {
						x: {
							time: false,
						},
						y: {
							auto: false,
							range,
						}
					},
					axes: [
						{},
						{
							size: 60,
						},
					],
					series: [
						{},
						{
							label: "Trips",
							stroke: "red",
							width: 1 / devicePixelRatio,
						},
						...extraSeries,
					],
				};

				return new uPlot(opts, data, document.body);
			}

			fetch("./data/taxi-trips.json").then(r => r.json()).then(data => {
				makeChart("Taxi Trips (raw)", [0, 4e4], [
					data.map((v, i) => i),
					data,
				]);

				const controls = document.createElement("form");
				controls.innerHTML = `
					<p>Global mode compares values across the full series. Local mode also limits neighbors to a centered sample window.
					Blue points are outliers. Core points and their border points are inliers. The original data stays unchanged.</p>
					<p>The radius counts sample positions, not elapsed time. Missing samples retain their positions.
					Windows at the series edges contain fewer samples, but the minimum count stays fixed.</p>
					<p>For a local example, use epsilon 1000, minimum points 5, and radius 50.
					The global defaults classify every sample as an outlier at radius 50.</p>
					<label>Mode: <select name="mode"><option value="global">Global</option><option value="local">Local</option></select></label>
					<label>Window radius (samples on each side): <input name="windowRadius" type="number" min="0" step="1" value="50" required disabled></label>
					<label>Value threshold (epsilon): <input name="epsilon" type="number" min="0" step="any" value="100" required></label>
					<label>Minimum points (including self): <input name="minPoints" type="number" min="1" step="1" value="20" required></label>
					<button>Find outliers</button>
					<output aria-live="polite"></output>
				`;
				document.body.appendChild(controls);

				const detector = prepareDbscan1d(data);
				const detectionOptions = {epsilon: 100, minPoints: 20, windowRadius: Infinity};
				const outliers = Array(data.length).fill(null);
				const outlierData = [data.map((v, i) => i), data, outliers];
				const output = controls.querySelector("output");
				const outlierChart = makeChart("Taxi Trips (DBSCAN outliers)", [0, 4e4], outlierData, [{
					label: "Outliers",
					stroke: "blue",
					paths: () => null,
					points: {show: true, size: 7, fill: "blue"},
				}]);

				function findOutliers() {
					detectionOptions.epsilon = controls.elements.epsilon.valueAsNumber;
					detectionOptions.minPoints = controls.elements.minPoints.valueAsNumber;
					detectionOptions.windowRadius = controls.elements.mode.value === "local" ? controls.elements.windowRadius.valueAsNumber : Infinity;
					console.time("dbscan1d");
					const labels = detector.detect(detectionOptions);
					console.timeEnd("dbscan1d");

					let count = 0;
					for (let i = 0; i < data.length; i++) {
						outliers[i] = labels[i] === -1 ? data[i] : null;
						if (labels[i] === -1)
							count++;
					}
					outlierChart.setData(outlierData);
					output.textContent = ` ${count} outliers`;
				}

				controls.elements.mode.addEventListener("change", () => {
					controls.elements.windowRadius.disabled = controls.elements.mode.value !== "local";
				});

				controls.addEventListener("submit", event => {
					event.preventDefault();
					findOutliers();
				});
				findOutliers();

				const madControls = document.createElement("form");
				madControls.id = "double-mad-controls";
				madControls.innerHTML = `
					<p>Double MAD uses a Harrell–Davis median and separate left and right MADs across the full series.
					Each MAD is the Harrell–Davis median of the absolute deviations on that side.</p>
					<p>Score = 0.67449 × absolute deviation / side MAD. Scores above the threshold are outliers.
					With zero side MAD, values unequal to the center are outliers. The original data stays unchanged.</p>
					<label>Score threshold: <input name="threshold" type="number" min="0" step="any" value="3.5" required></label>
					<button>Find outliers</button>
					<output aria-live="polite"></output>
					<p class="mad-stats"></p>
				`;
				document.body.appendChild(madControls);

				console.time("double-mad prepare");
				const madDetector = prepareDoubleMad(data);
				console.timeEnd("double-mad prepare");
				const madOutliers = Array(data.length).fill(null);
				const madData = [outlierData[0], data, madOutliers];
				const madOutput = madControls.querySelector("output");
				madControls.querySelector(".mad-stats").textContent =
					`Median: ${madDetector.median?.toFixed(2) ?? "n/a"}; left MAD: ${madDetector.leftMad?.toFixed(2) ?? "n/a"}; right MAD: ${madDetector.rightMad?.toFixed(2) ?? "n/a"}`;
				const madChart = makeChart("Taxi Trips (Double MAD, Harrell–Davis)", [0, 4e4], madData, [{
					label: "Outliers",
					stroke: "blue",
					paths: () => null,
					points: {show: true, size: 7, fill: "blue"},
				}]);

				function findMadOutliers() {
					console.time("double-mad detect");
					const labels = madDetector.detect(madControls.elements.threshold.valueAsNumber);
					console.timeEnd("double-mad detect");

					let count = 0;
					for (let i = 0; i < data.length; i++) {
						madOutliers[i] = labels[i] === -1 ? data[i] : null;
						if (labels[i] === -1)
							count++;
					}
					madChart.setData(madData);
					madOutput.textContent = ` ${count} outliers`;
				}

				madControls.addEventListener("submit", event => {
					event.preventDefault();
					findMadOutliers();
				});
				findMadOutliers();

				console.time("sgg");
				let data3 = sgg(data, 1, {
					windowSize: 101,
				//	derivative: 1,
				});
				console.timeEnd("sgg");
			//	console.log(data3);

				makeChart("Savitzky-Golay", [0, 3e4], [
					data3.map((v, i) => i),
					data3,
				]);

				console.time("smooth");
				let data2 = smooth(data, 150);
				console.timeEnd("smooth");

				makeChart("Taxi Trips (ASAP FFT)", [12e3, 20e3], [
					data2.map((v, i) => i),
					data2,
				]);

				function movingAvg(data, wind) {
					let rolled = Array(data.length).fill(null);

					let sum = 0;
					let count = 0;

					for (let i = 0; i < data.length; i++) {
						let y = data[i];

						if (y == null)
							continue;

						sum += y;
						count++;

						if (i > wind - 1) {
							sum -= data[i - wind];
							count--;
						}

						rolled[i] = sum / count;
					}

					return rolled;
				}

				console.time("roll");
				let rolled = movingAvg(data, 300);
				console.timeEnd("roll");

				makeChart("Taxi Trips (Moving Avg 300)", [10e3, 20e3], [
					rolled.map((v, i) => i),
					rolled,
				]);
			});
		</script>
	</body>
</html>
