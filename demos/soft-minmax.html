<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Soft Min/Max</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				display: inline-block;
				width: min-content;
				vertical-align: top;
			}

			p {
				margin: 0;
				padding: 10px;
			}

			button {
				position: absolute;
				left: 100px;
				top: 100px;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import { renderDemo } from './renderDemo.js';

			await import('../dist/uPlot.esm.js').then(m => { window.uPlot = m.default; });
			await import('./soft-minmax.js').then(async ({ default: groups, incrementDataMax }) => {
				const plots = (await renderDemo(groups)).flat();
				window.dataMaxIncr = () => {
					setInterval(() => incrementDataMax(plots), 50);
				};
			});
		</script>
		<button onclick="dataMaxIncr()">▶ dataMax++</button>
	</body>
</html>
