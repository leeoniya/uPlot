<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Multi-Bars</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
		<style>
			.uplot {
				margin-bottom: 20px;
			}

			.uplot .legend .series:first-child,
			.uplot .legend .series th::after,
			.uplot .legend .series td {
				display: none;
			}

			.lib-toggles {
				grid-column: 1 / -1;
				grid-row: -1;
				text-align: center;
			}

			button {
				margin: 10px;
			}

			.hidden {
				color: silver;
			}

			.u-cursor-pt {
				border-radius: 13px;
			}
		</style>
	</head>
	<body>

		<script type="module">
			import { renderDemo } from './renderDemo.js';

			await import('./multi-bars.js').then(({ default: groups }) => renderDemo(groups));
		</script>
	</body>
</html>
