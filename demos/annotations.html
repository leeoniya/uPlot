<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Annotations</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">

		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			.u-over {
				overflow: hidden;
			}

			.u-mark-x {
				position: absolute;
				display: inline-block;
				height: 100%;
				cursor: pointer;
			}

			.u-mark-x-label {
				position: absolute;
				transform: translateX(-50%);
				padding: 0 4px;
				background: #fff !important;
			}

			.u-mark-x:hover {
				border-left-style: solid !important;
			/*	border-right-style: solid !important;*/
			}

			.u-mark-x:hover .u-mark-x-label {
				border-style: solid !important;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import { renderDemo } from './renderDemo.js';

			await import('../dist/uPlot.esm.js').then(m => { window.uPlot = m.default; });
			await import('./annotations.js').then(({ default: groups }) => renderDemo(groups));
		</script>
	</body>
</html>
