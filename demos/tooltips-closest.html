<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Tooltips (closest)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="../dist/uPlot.min.css">
	<style>
		.uplot {
			display: inline-block;
			vertical-align: top;
			width: min-content;
		}

		.u-over {
			box-shadow: 0px 0px 0px 0.5px #ccc;
		}

		.u-legend {
			text-align: left;
			padding-left: 50px;
		}

		.u-inline tr {
			margin-right: 8px;
		}

		.u-label {
			font-size: 12px;
		}

		.u-tooltip .u-focus,
		.u-legend .u-focus {
			background: none;
		}
	</style>
</head>
<body>
	<script src="../dist/uPlot.iife.js"></script>
	<script>
		const seriesColors = ["#7cb5ec", "#434348", "#90ed7d", "#f7a35c", "#8085e9", "#f15c80", "#e4d354", "#2b908f", "#f45b5b", "#91e8e1"];
		const interpolatedColor = "#fcb0f1";

		function commitPlugin({onclick, commits, isInterpolated}) {
			let tooltip;
			const fmtDate = uPlot.fmtDate("{M}/{D}/{YY} {h}:{mm}:{ss} {AA}");

			function update(u) {
				const seriesIdx = u.tooltip.order[0];
				const dataIdx = u.tooltip.idxs[seriesIdx];
				u.over.style.cursor = dataIdx == null ? "" : "pointer";
				if (tooltip != null && dataIdx != null)
					tooltip.style.borderColor = isInterpolated(dataIdx) ? interpolatedColor : seriesColors[seriesIdx - 1];
			}

			return {
				opts: (u, opts) => {
					opts.tooltip = {
						show: true,
						transpose: true,
						filter: (u, si) => u.series[si].show && u.series[si]._focus === true && u.tooltip.idxs[si] != null,
						mount(u, el) {
							tooltip = el;
							update(u);
						},
					};
					for (let si = 1; si < opts.series.length; si++) {
						opts.series[si].values = (u, si, idx) => {
							const value = u.data?.[si][idx];
							if (idx == null || value == null)
								return {Time: "", Commit: "", Value: "", "Since start": ""};
							const pctSinceStart = ((value - u.data[si][0]) / u.data[si][0] * 100).toFixed(2);
							return {
								Time: fmtDate(new Date(u.data[0][idx] * 1e3)),
								Commit: commits[idx][1].slice(0,10),
								Value: uPlot.fmtNum(value),
								"Since start": pctSinceStart + "%",
							};
						};
					}
				},
				hooks: {
					ready: [
						u => {
							const over = u.over;

							let clientX;
							let clientY;

							over.addEventListener("mousedown", e => {
								clientX = e.clientX;
								clientY = e.clientY;
							});

							over.addEventListener("mouseup", e => {
								// Only an in-place primary click opens the comparison, not a zoom drag.
								if (e.button == 0 && e.clientX == clientX && e.clientY == clientY) {
									const seriesIdx = u.tooltip.order[0];
									const dataIdx = u.tooltip.idxs[seriesIdx];
									if (dataIdx != null)
										onclick(u, seriesIdx, dataIdx);
								}
							});
						}
					],
					setLegend: [update],
					drawAxes: [
						u => {
							let { ctx } = u;
							let { left, top, width, height } = u.bbox;

							const interpolatedColorWithAlpha = "#fcb0f17a";

							ctx.save();

							ctx.strokeStyle = interpolatedColorWithAlpha;
							ctx.beginPath();

							let [ i0, i1 ] = u.series[0].idxs;

							for (let j = i0; j <= i1; j++) {
								let v = u.data[0][j];

								if (isInterpolated(j)) {
									let cx = Math.round(u.valToPos(v, 'x', true));
									ctx.moveTo(cx, top);
									ctx.lineTo(cx, top + height);
								}
							}

							ctx.closePath();
							ctx.stroke();
							ctx.restore();
						},
					],
				}
			};
		}

		function genPlotOpts({title, width, height, yAxisLabel, series, commits, stat, isInterpolated, alpha = 0.3, prox = 5}) {
			return {
				title,
				width,
				height,
				series,
				legend: {
					live: false,
				},
				focus: {
					alpha,
				},
				cursor: {
					focus: {
						prox,
					},
					drag: {
						x: true,
						y: true,
					},
				},
				scales: {
					y: {
						range: (self, dataMin, dataMax) => uPlot.rangeNum(0, dataMax, 0.2, true)
					}
				},
				axes: [
					{
						grid: {
							show: false,
						}
					},
					{
						label: yAxisLabel,
						space: 24,
						values: (self, splits) => {
							return splits.map(v => {
								return (
									v >= 1e12 ? v/1e12 + "T" :
									v >= 1e9  ? v/1e9  + "G" :
									v >= 1e6  ? v/1e6  + "M" :
									v >= 1e3  ? v/1e3  + "k" :
									v
								);
							});
						},
					},
				],
				plugins: [
					commitPlugin({
						onclick(u, seriesIdx, dataIdx) {
							let thisCommit = commits[dataIdx][1];
							let prevCommit = (commits[dataIdx-1] || [null,null])[1];
							window.open(`https://perf.rust-lang.org/compare.html?start=${prevCommit}&end=${thisCommit}&stat=${stat}`);
						},
						commits,
						isInterpolated,
					}),
				],
			};
		}

		function renderPlots(data, state) {
			for (let benchName in data.benchmarks) {
				let benchKinds = data.benchmarks[benchName];

				function isInterpolated(dataIdx) {
					return benchKinds.interpolated.has(dataIdx);
				}

				let i = 0;

				for (let benchKind in benchKinds) {
					if (benchKind == "interpolated")
						continue;

					let cacheStates = benchKinds[benchKind];

					let yAxisLabel = i == 0 ? "Value" : null;

					let seriesOpts = [{}];

					let xVals = data.commits.map(c => c[0]);

					let plotData = [xVals];

					let j = 0;

					for (let cacheState in cacheStates) {
						let yVals = cacheStates[cacheState];

						plotData.push(yVals);

						seriesOpts.push({
							label: cacheState,
							width: devicePixelRatio,
							stroke: seriesColors[j],
						});

						j++;
					}

					let plotOpts = genPlotOpts({
						title: benchName + "-" + benchKind,
						width: window.innerWidth - 16,
						height: 600,
						yAxisLabel,
						series: seriesOpts,
						commits: data.commits,
						stat: state.stat,
						isInterpolated,
					});

					let u = new uPlot(plotOpts, plotData, document.body);

					i++;
				}
			}
		}

		function prepData(data) {
			let sortedBenchNames = Object.keys(data.benchmarks).sort();

			let benchmarks = {};

			sortedBenchNames.forEach(name => {
				const { Check, Debug, Opt } = data.benchmarks[name];

				benchmarks[name] = {
					interpolated: new Set(data.benchmarks[name].interpolated),
				//	check: Check,
				//	debug: Debug,
					opt:   Opt,
				}
			});

			data.benchmarks = benchmarks;

			return data;
		}

		const state = {
			start: "",
			end: "",
			stat: "instructions:u",
			absolute: true,
		};

		fetch("data/rustc-perf.json", state).then(r => r.json()).then(prepData).then(data => renderPlots(data, state));
	</script>
</body>
</html>
