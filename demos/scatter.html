<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Scatter &amp; Bubble</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
	</head>
	<body>

		<script type="module">
			import uPlot from "../dist/uPlot.esm.js";
			import { scatterPlugin } from './lib/scatterPlugin.js';

			function randInt(min, max) {
				return Math.floor(Math.random() * (max - min + 1)) + min;
			}

			function filledArr(len, val) {
				let arr = Array(len);

				if (typeof val == "function") {
					for (let i = 0; i < len; ++i)
						arr[i] = val(i);
				}
				else {
					for (let i = 0; i < len; ++i)
						arr[i] = val;
				}

				return arr;
			}

			function guardedRange(u, min, max) {
				if (max == min) {
					if (min == null) {
						min = 0;
						max = 100;
					}
					else {
						let delta = Math.abs(max) || 100;
						max += delta;
						min -= delta;
					}
				}

				return [min, max];
			}


			let points = 10000;
			let series = 5;

			let data = filledArr(series, v => [
				filledArr(points, i => randInt(0,500)),
				filledArr(points, i => randInt(0,500)),
			]);

			data[0] = null;

			const opts = {
				title: "Scatter Plot",
				mode: 2,
				width: 1920,
				height: 600,
				legend: {live: false},
				plugins: [scatterPlugin({batch: true, points: {size: 5, width: 0}})],
				scales: {
					x: {time: false, range: guardedRange},
					y: {range: guardedRange},
				},
				series: [
					null,
					...['red', 'green', 'blue', 'magenta'].map(color => ({
						stroke: color,
						fill: color,
					})),
				],
			};

			let u = new uPlot(opts, data, document.body);

			points = 50;


			let data2 = filledArr(series, v => [
				filledArr(points, i => randInt(0,500)),
				filledArr(points, i => randInt(0,500)),
				filledArr(points, i => randInt(1,10000)),  // bubble size, population
				filledArr(points, i => (Math.random() + 1).toString(36).substring(7)), // label / country name
			]);

			data2[0] = null;
			data2[1][1] = data2[1][1].map(v => v == 0 ? v : v * -1);

			const legendValues = (u, seriesIdx, dataIdx) => {
				// when data null, it's initial schema probe (also u.status == 0)
				if (u.data == null || dataIdx == null) {
					return {
						"Country":    '<NUM COUNTRIES>',
						"Population": '<TOTAL POP>',
						"GDP":        '<TOTAL GDP>',
						"Income":     '<AVG INCOME>'
					};
				}

				let [x, y, size, label] = u.data[seriesIdx];

				return {
					"Country":    label[dataIdx],
					"Population": size[dataIdx],
					"GDP":        '$' + x[dataIdx],
					"Income":     '$' + y[dataIdx],
				};
			};


			const opts2 = {
				title: "Bubble Plot",
				mode: 2,
				width: 1920,
				height: 600,
				plugins: [scatterPlugin({
					hover: true,
					points: {width: 1},
					disp: {
						size: {
							scale: 'size',
							range: [1, 61], // 0–60px diameter plus the 1px outline
							values: (u, seriesIdx) => u.data[seriesIdx][2],
						},
					},
				})],
				axes: [
					{
						label: "GDP",
					},
					{
						label: "Income 1",
					},
					{
						side: 1,
						scale: 'y2',
						stroke: "red",
						label: "Income 2",
						grid: {
							show: false,
						},
					},
				],
				scales: {
					x: {time: false, range: guardedRange},
					y: {range: guardedRange},
					y2: {
						dir: 1,
						ori: 1,
						range: guardedRange,
					},
					size: {
						time: false,
						distr: 100,
						fwd: Math.sqrt,
						bwd: v => v * v,
						// A zero-based sqrt scale makes bubble area proportional to population.
						range: (u, min, max) => [0, max > 0 ? max : 1],
					}
				},
				series: [
					null,
					{
						facets: [{scale: 'x'}, {scale: 'y2'}, {scale: 'size'}],
						label: "Region A",
						stroke: "red",
						fill: "rgba(255,0,0,0.3)",
						values: legendValues,
					},
					{
						facets: [{scale: 'x'}, {scale: 'y'}, {scale: 'size'}],
						label: "Region B",
						stroke: "green",
						fill: "rgba(0,255,0,0.3)",
						values: legendValues,
					},
					{
						facets: [{scale: 'x'}, {scale: 'y'}, {scale: 'size'}],
						label: "Region C",
						stroke: "blue",
						fill: "rgba(0,0,255,0.3)",
						values: legendValues,
					},
					{
						facets: [{scale: 'x'}, {scale: 'y'}, {scale: 'size'}],
						label: "Region E",
						stroke: "orange",
						fill: "rgba(255,128,0,0.3)",
						values: legendValues,
					},
				],
			};

			let u2 = new uPlot(opts2, data2, document.body);

			const levelColors = ['green', 'orange', 'red'];
			const level = filledArr(300, i => i < 265 ? 0 : i < 290 ? 1 : 2);
			const data3 = [null, [
				filledArr(level.length, i => randInt(0,500)),
				filledArr(level.length, i => randInt(0,500)),
				level,
			]];

			const opts3 = {
				title: "Scatter Plot by Level",
				mode: 2,
				width: 1920,
				height: 600,
				plugins: [scatterPlugin({
					hover: true,
					batch: true,
					points: {size: 10, width: 0},
					disp: {
						fill: {
							kind: 2,
							values: (u, seriesIdx) => [levelColors, u.data[seriesIdx][2]],
						},
					},
				})],
				scales: {
					x: {time: false, range: guardedRange},
					y: {range: guardedRange},
				},
				series: [
					null,
					{
						label: "Level (0: green, 1: orange, 2: red)",
						values: (u, seriesIdx, dataIdx) => {
							if (u.data == null || dataIdx == null)
								return {x: '--', y: '--', level: '--'};

							let [x, y, level] = u.data[seriesIdx];
							return {x: x[dataIdx], y: y[dataIdx], level: level[dataIdx]};
						},
					},
				],
			};

			let u3 = new uPlot(opts3, data3, document.body);
		</script>
	</body>
</html>
