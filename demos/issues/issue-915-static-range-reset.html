<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Issue 915: Static range reset</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../../dist/uPlot.min.css">
	<script src="../../dist/uPlot.iife.js"></script>
	<style>
		body { font: 14px system-ui, sans-serif; margin: 20px; }
		.controls { display: flex; gap: 8px; margin: 12px 0; }
		pre { background: #eee; padding: 10px; }
	</style>
</head>
<body>
	<h1>Issue 915: reset a zoomed static Y range</h1>
	<p><a href="https://github.com/leeoniya/uPlot/issues/915">GitHub issue #915</a></p>
	<p>Remaining gap: double-click resets X but does not restore Y. Explicit null Y bounds restore [1, 10].</p>
	<div id="chart"></div>
	<div class="controls">
		<button id="zoom">Set Y to [2, 4]</button>
		<button id="dblclick">Run double-click reset</button>
		<button id="reset">Explicitly reset Y</button>
	</div>
	<pre id="status"></pre>
	<script>
		const data = [[0, 1, 2], [2, 3, 5]];
		const opts = {
			width: 800,
			height: 400,
			scales: { x: { time: false }, y: { range: [1, 10] } },
			series: [{}, { label: "Values", stroke: "blue" }],
		};
		const u = new uPlot(opts, data, document.querySelector("#chart"));
		const status = document.querySelector("#status");
		function update(note) {
			status.textContent = note + "\n\n" + JSON.stringify({
				x: [u.scales.x.min, u.scales.x.max],
				y: [u.scales.y.min, u.scales.y.max],
			}, null, 2);
		}
		function run(action, note) { action(); queueMicrotask(() => update(note)); }
		document.querySelector("#zoom").onclick = () => run(() => u.setScale("y", { min: 2, max: 4 }), "Y manually zoomed.");
		document.querySelector("#dblclick").onclick = () => run(() => {
			u.over.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, cancelable: true, button: 0 }));
		}, "Current gap: Y remains [2, 4].");
		document.querySelector("#reset").onclick = () => run(() => u.setScale("y", { min: null, max: null }), "Explicit recalculation restores Y.");
		queueMicrotask(() => update("Initial static range."));
	</script>
</body>
</html>
