<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Issue 808: Static range scan</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../../dist/uPlot.min.css">
	<script src="../../dist/uPlot.iife.js"></script>
	<style>body { font: 14px system-ui, sans-serif; margin: 20px; } pre { background: #eee; padding: 10px; }</style>
</head>
<body>
	<h1>Issue 808: scan with a static range</h1>
	<p><a href="https://github.com/leeoniya/uPlot/issues/808">GitHub issue #808</a></p>
	<p>Expected: Y stays at [-12, 12], the series cache is populated, and the thick boundary stroke is visible.</p>
	<div id="chart"></div>
	<pre id="status"></pre>
	<script>
		const data = [[0, 1, 2], [-12, 0, 12]];
		const opts = {
			width: 800,
			height: 400,
			scales: {
				x: { time: false },
				y: { range: [-12, 12], scan: true },
			},
			series: [{}, { label: "Boundary values", stroke: "blue", width: 5, points: { show: true, size: 8 } }],
		};
		const u = new uPlot(opts, data, document.querySelector("#chart"));
		queueMicrotask(() => {
			document.querySelector("#status").textContent = JSON.stringify({
				y: [u.scales.y.min, u.scales.y.max],
				seriesExtrema: [u.series[1].min, u.series[1].max],
			}, null, 2);
		});
	</script>
</body>
</html>
