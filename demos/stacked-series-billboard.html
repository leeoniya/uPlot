<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Stacked Zeros — billboard.js</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.3/dist/billboard.min.css">
		<link rel="stylesheet" href="./stacked-series-compare.css">
		<style>
			#plot .bb-line { stroke-width: 3px; stroke-opacity: 1; stroke-dasharray: none; opacity: 1; }
			#plot .bb-area { opacity: 0.18; }
		</style>
	</head>
	<body>
		<main id="demo"><p>Loading billboard.js…</p></main>
		<script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.3/dist/billboard.pkgd.min.js"></script>
		<script type="module">
			import {mountDemo} from './stacked-series-compare.js';
			import {createDemo} from './stacked-series-billboard.js';
			window.stackedDemo = await mountDemo(document.querySelector('#demo'), 'billboard', createDemo);
		</script>
	</body>
</html>
