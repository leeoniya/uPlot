<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>Sync Y Zero</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="../dist/uPlot.min.css">
</head>

<body>
	<script src="../dist/uPlot.iife.js"></script>
	<script type="module">
		import { syncZeroRanges } from './lib/syncZeroRanges.js';
		let data = [
			[0, 1, 2],

		/*
			[-10, 35, 0],
			[-150, -1732, -500],
			[3751, 10000, 7389],
		*/

			[-10, 35, 100],
			[-150, 1732, -30],
			[3751, 10000, 7389],
		];

		let synced = false;

		let dataMinMaxes = {
			y: null,
			y2: null,
			y3: null,
		};

		let syncedRange = {};

		let symRange = (u, dataMin, dataMax, scaleKey) => {
			if (dataMin == null || dataMax == null)
				return [null, null];
			let abs = Math.max(Math.abs(dataMin), Math.abs(dataMax)) || 1;
			return [-abs, abs];
		};

		let range = (u, dataMin, dataMax, scaleKey) => {
			dataMinMaxes[scaleKey] = [dataMin, dataMax];
			return !synced ? [dataMin, dataMax] : syncedRange[scaleKey] ?? symRange(u, dataMin, dataMax, scaleKey);
		};

		const opts = {
			title: 'Raw → symmetric (3s) → zero-aligned (6s)',
			width: 800,
			height: 400,
			scales: {
				x: {
					time: false,
				},
				y: {
					range,
				},
				y2: {
					range,
				},
				y3: {
					range,
				}
			},
			axes: [
				{},
				{
					scale: 'y',
					stroke: 'red',
					grid: { show: false },
				},
				{
					scale: 'y2',
					stroke: 'green',
					grid: { show: false },
				},
				{
					scale: 'y3',
					stroke: 'blue',
					grid: { show: false },
				},
			],
			series: [
				{},
				{
					label: "Data 1",
					scale: 'y',
					stroke: "red",
				},
				{
					label: "Data 2",
					scale: 'y2',
					stroke: "green",
				},
				{
					label: "Data 3",
					scale: 'y3',
					stroke: "blue",
				},
			],
		};

		// Calculate from the data before either chart exists, without layout or scale callbacks.
		const extrema = {};
		opts.series.slice(1).forEach((series, i) => {
			const values = data[i + 1].filter(value => value != null);
			extrema[series.scale] = values.length ? [Math.min(...values), Math.max(...values)] : [null, null];
		});
		const directRanges = syncZeroRanges(extrema);
		const directScales = { x: { time: false } };
		for (const key in directRanges)
			directScales[key] = { range: directRanges[key] };

		let u = new uPlot(opts, data, document.body);

		// Fixed ranges show the final alignment on the first draw; new data requires recalculation.
		const direct = new uPlot({
			...opts,
			title: 'Zero-aligned on the first draw (precomputed fixed ranges)',
			scales: directScales,
		}, data, document.body);

		const scaleKeys = ['y', 'y2', 'y3'];
		function alignedRange(u, dataMin, dataMax, scaleKey) {
			const [i0, i1] = u.series[0].idxs;
			const extrema = {};
			// Reuse uPlot's series-extrema cache, which it invalidates for data and X-range changes.
			for (const key of scaleKeys)
				extrema[key] = uPlot.scan(u, key, i0, i1, true);
			return syncZeroRanges(extrema)[scaleKey];
		}

		const automatic = new uPlot({
			...opts,
			title: 'Zero-aligned before drawing (scan + range callback)',
			scales: {
				x: { time: false },
				y: { range: alignedRange },
				y2: { range: alignedRange },
				y3: { range: alignedRange },
			},
		}, data, document.body);

		setTimeout(() => {
			synced = true;
			u.redraw(true);
		}, 3000);

		setTimeout(() => {
			synced = true;
			syncedRange = syncZeroRanges(dataMinMaxes);
			u.redraw(true);
		}, 6000);
	</script>
</body>

</html>
