<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>ArcSinh Scales</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="../dist/uPlot.min.css">
	</head>
	<body>
		<label id="thresh-label" for="linthresh">Linear thershold: 1</label>
		<br>
		<input type="range" id="linthresh" name="linthresh" min="-3" max="3" value="0" step="1">

		<script type="module">
			import { renderDemo } from "./renderDemo.js";

			await import("../dist/uPlot.esm.js").then(m => { window.uPlot = m.default; });
			await import("./arcsinh-scales.js").then(({ default: groups }) => renderDemo(groups));
		</script>
	</body>
</html>
